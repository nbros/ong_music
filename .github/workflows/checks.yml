# The checks a commit must pass before anything of it goes online: analyze, the unit tests (in two halves) and the
# browser tests (under both compilers), each in a job of its own, side by side. Called by flutter_ci.yml (before the
# upload to Google Play) and pages.yml (before the deployment of the site): their publishing job needs the job that
# calls this workflow, which succeeds only if every job here succeeded.
#
# No job here has an `if` or a `needs`: none of them can be skipped, so a check that did not run cannot pass for one
# that did. The callers pass no secret: the checks need none.
name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests ${{ matrix.half }}/2
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # both halves report, a failure in one does not hide the other's
      matrix:
        half: [1, 2]

    steps:
      - name: Checkout from GitHub
        uses: actions/checkout@v7

      # A called workflow does not see the env of its caller: the version is read from flutter_ci.yml, which holds it.
      - name: Read Flutter version
        id: flutter
        run: |
          version=$(sed -n 's/^ *FLUTTER_VERSION: *"\(.*\)".*/\1/p' .github/workflows/flutter_ci.yml)
          if [[ ! "$version" =~ ^[0-9A-Za-z.+-]+$ ]]; then
            echo "::error::no single FLUTTER_VERSION in .github/workflows/flutter_ci.yml (read: '$version')"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        if: matrix.half == 1
        run: flutter analyze

      # Every test file in one half: by size in bytes (a stand-in for the time it takes), the largest first, each to
      # the half with fewer bytes so far. The same split on every runner, and a new test file goes to a half without
      # editing this workflow. Each half compiles and loads only its own files: `flutter test --total-shards 2` would
      # compile and load every file in both shards and split the tests inside them, which saves much less.
      - name: Run tests
        shell: bash # with pipefail
        env:
          HALF: ${{ matrix.half }}
        run: |
          split=$(find test -name '*_test.dart' -print0 | xargs -0 wc -c | awk '$2 != "total"' \
            | LC_ALL=C sort -k1,1nr -k2,2 \
            | awk '{ name = $0; sub(/^ *[0-9]+ /, "", name)
                     h = (bytes[1] <= bytes[2]) ? 1 : 2; bytes[h] += $1; print h " " name }')
          all=$(find test -name '*_test.dart' | wc -l)
          if [[ $(grep -c '^[12] ' <<< "$split") -ne "$all" ]]; then
            echo "::error::the split does not hold the ${all} test files once each"
            exit 1
          fi
          files=()
          while IFS= read -r file; do
            files+=("$file")
          done < <(awk -v half="$HALF" '$1 == half { sub(/^[12] /, ""); print }' <<< "$split")
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::half ${HALF} has no test file (flutter test would run them all)"
            exit 1
          fi
          echo "::group::${#files[@]} of the ${all} test files"
          printf '%s\n' "${files[@]}"
          echo "::endgroup::"
          flutter test "${files[@]}"

  browser-tests:
    name: Browser tests (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # both compilers report, a failure under one does not hide the other's
      matrix:
        include:
          - compiler: JavaScript
            args: ""
          - compiler: WebAssembly
            args: "--wasm"

    steps:
      - name: Checkout from GitHub
        uses: actions/checkout@v7

      # A called workflow does not see the env of its caller: the version is read from flutter_ci.yml, which holds it.
      - name: Read Flutter version
        id: flutter
        run: |
          version=$(sed -n 's/^ *FLUTTER_VERSION: *"\(.*\)".*/\1/p' .github/workflows/flutter_ci.yml)
          if [[ ! "$version" =~ ^[0-9A-Za-z.+-]+$ ]]; then
            echo "::error::no single FLUTTER_VERSION in .github/workflows/flutter_ci.yml (read: '$version')"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The tests that run in a browser (the list and the reasons: tool/browser_tests.sh): Chrome is on the runner.
      # Under both compilers, as the site holds the app twice: compiled to JavaScript and to WebAssembly.
      - name: Run browser tests
        run: bash tool/browser_tests.sh ${{ matrix.args }}
