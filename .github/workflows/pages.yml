# Builds and deploys the whole GitHub Pages site, served at https://ongmusic.nbros.dev/ (a custom domain, see
# README.md):
# - at the root: the Flutter web app (the way to use Ong Music on iPhone/iPad);
# - beside it: the Jekyll pages from docs/, built like legacy Pages did (/privacy-policy, /download).
#
# Requires Settings → Pages → Build and deployment → Source: "GitHub Actions" (see README.md),
# and the "github-pages" environment must allow tags (Settings → Environments → github-pages).
#
# Kept separate from flutter_ci.yml so that a Pages failure never turns the Play Store / Windows release run red.
name: GitHub Pages

on:
  push:
    tags:
      - "*" # same as flutter_ci.yml: the web app is released together with Android and Windows
  workflow_dispatch: # deploy a branch by hand (e.g. master, to try it on a real iPhone before tagging)

# Must be the same value as FLUTTER_VERSION in flutter_ci.yml: bump both together
# (the "Check Flutter version" step below fails the build if they differ).
env:
  FLUTTER_VERSION: "3.50.0"

permissions:
  contents: read

# One deployment at a time. A queued run waits for the running one instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # configure-pages and the Jekyll build read the Pages site settings

    steps:
      - name: Checkout from GitHub
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags are needed to compute the version

      - name: Check Flutter version
        run: |
          ci_version=$(sed -n 's/^ *FLUTTER_VERSION: *"\(.*\)".*/\1/p' .github/workflows/flutter_ci.yml)
          if [[ "$ci_version" != "$FLUTTER_VERSION" ]]; then
            echo "::error::FLUTTER_VERSION is '$FLUTTER_VERSION' in pages.yml but '$ci_version' in flutter_ci.yml: bump both together"
            exit 1
          fi

      # Same computation as flutter_ci.yml. On a tag: the tag name (e.g. 1.5.0).
      # Otherwise: last tag with the patch number incremented (e.g. 1.5.1).
      - name: Compute version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="$GITHUB_REF_NAME"
          else
            last_tag=$(git describe --tags --abbrev=0)
            version="${last_tag%.*}.$(( ${last_tag##*.} + 1 ))"
          fi
          echo "majorMinorPatch=${version}" >> "$GITHUB_OUTPUT"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # Same build as legacy Pages from /docs (github-pages gem, same plugins, default theme), so that
      # privacy-policy.md renders at /privacy-policy as before. docs/ must have no index.md (nor README.md, which
      # the gem would turn into one): the index of the site is the web app.
      #
      # Into a directory of its own: jekyll-build-pages is a Docker action running as root, so everything it
      # writes is owned by root, and the runner user cannot add a file next to it (actions/jekyll-build-pages#101,
      # #18). The site is put together below, from copies.
      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_jekyll

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The same checks as flutter_ci.yml: a commit that fails them must not go online here either.
      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # --no-web-resources-cdn: CanvasKit and the Roboto font served from this site, not from gstatic.com.
      # --web-content-hash: main.dart.<hash>.js and assets/*.<hash>.*, so that a deployment never mixes with files
      # of the previous one in browser caches (web/index.html revalidates flutter_bootstrap.js, which names them).
      - name: Build web app
        run: >-
          flutter build web --release
          --base-href /
          --no-web-resources-cdn
          --web-content-hash
          --build-name=${{ steps.version.outputs.majorMinorPatch }}
          --build-number=${{ github.run_number }}
          --dart-define=APP_VERSION=${{ steps.version.outputs.majorMinorPatch }}

      # The Jekyll pages, then the web app at the root of the site, next to them. The two only share the assets/
      # directory, where Jekyll writes assets/css/ and Flutter everything else.
      - name: Put the site together
        run: |
          mkdir _site
          cp -R _jekyll/. _site/
          chmod -R u+w _site
          if [[ -e _site/index.html ]]; then
            echo "::error::docs/ produced an index.html: it would be replaced by the web app's, which is the site's"
            exit 1
          fi
          cp -R build/web/. _site/
          # what the site must have: the app, and the privacy policy the Play Store listing links to
          test -f _site/index.html
          test -f _site/flutter_bootstrap.js
          test -f _site/privacy-policy.html || test -f _site/privacy-policy/index.html

      # Excludes dotfiles (only build/web/.last_build_id, which is not needed).
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
