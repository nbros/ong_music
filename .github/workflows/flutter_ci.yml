name: Flutter CI/CD

on:
  push:
    branches:
      - master
    tags:
      - "*"

# Flutter version used to build: bump it deliberately (and test locally) instead of
# following "stable", so that a new Flutter release can't silently break a release build.
# pages.yml has its own copy: bump both together (pages.yml checks that they match).
env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout from GitHub
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags are needed to compute the version

      # On a tag: the tag name (e.g. 1.5.0). Otherwise: last tag with the patch number incremented (e.g. 1.5.1).
      - name: Compute version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="$GITHUB_REF_NAME"
          else
            last_tag=$(git describe --tags --abbrev=0)
            version="${last_tag%.*}.$(( ${last_tag##*.} + 1 ))"
          fi
          echo "majorMinorPatch=${version}" >> "$GITHUB_OUTPUT"
          echo "shortSha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        run: echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          echo "storeFile=upload-keystore.jks" > android/key.properties
          echo "storePassword=${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.UPLOAD_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=upload" >> android/key.properties

      # AGP 9 lint needs Java 21+ (Java 17 fails with NoSuchMethodError: List.removeLast()).
      # 25 is the JDK bundled with Android Studio, used for local builds.
      - name: Setup Java JDK
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "gradle"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # The tests that run in a browser (the list and the reasons: tool/browser_tests.sh): Chrome is on the runner.
      # Twice, as the site holds the app twice: compiled to JavaScript and to WebAssembly.
      - name: Run browser tests
        run: bash tool/browser_tests.sh

      - name: Run browser tests (WebAssembly)
        run: bash tool/browser_tests.sh --wasm

      - name: Build App Bundle
        run: flutter build appbundle --build-name=${{ steps.version.outputs.majorMinorPatch }}+${{ steps.version.outputs.shortSha }} --build-number=${{ github.run_number }} --dart-define=APP_VERSION=${{ steps.version.outputs.majorMinorPatch }}

      - name: Upload App Bundle
        uses: actions/upload-artifact@v7
        with:
          name: app-release.aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      # if a tag is being pushed, upload to Google Play
      - name: Upload to Google Play
        if: startsWith(github.ref, 'refs/tags/')
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: nbros.ong_music
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: "alpha" # internal, alpha, beta, production (comma-separated list)
          status: completed # draft, or completed(default) to release directly

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write # to create the GitHub release

    steps:
      - name: Checkout from GitHub
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags are needed to compute the version

      - name: Compute version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="$GITHUB_REF_NAME"
          else
            last_tag=$(git describe --tags --abbrev=0)
            version="${last_tag%.*}.$(( ${last_tag##*.} + 1 ))"
          fi
          echo "majorMinorPatch=${version}" >> "$GITHUB_OUTPUT"
          echo "zipBasename=Ong_Music-windows-${version}+${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows app
        run: flutter build windows --release --build-name=${{ steps.version.outputs.majorMinorPatch }} --build-number=${{ github.run_number }} --dart-define=APP_VERSION=${{ steps.version.outputs.majorMinorPatch }}

      - name: Create Windows build zip
        run: |
          mkdir "${{ steps.version.outputs.zipBasename }}"
          mv build/windows/x64/runner/Release/* "${{ steps.version.outputs.zipBasename }}"
          7z a "${{ steps.version.outputs.zipBasename }}.zip" "${{ steps.version.outputs.zipBasename }}"

      - name: Upload Windows app zip
        uses: actions/upload-artifact@v7
        with:
          name: "${{ steps.version.outputs.zipBasename }}.zip"
          path: "${{ steps.version.outputs.zipBasename }}.zip"

      # for-each-ref takes the full ref ("git tag -l refs/tags/x" matches nothing, as tag -l patterns apply to short names)
      - name: Read tag message
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: git for-each-ref --format='%(contents)' "$GITHUB_REF" > tag-message.txt

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: "${{ steps.version.outputs.zipBasename }}.zip"
          body_path: tag-message.txt
