<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Replaced by the value of `flutter build web --base-href` (/ong_music/app/ on GitHub Pages).
    Every URL below is relative to it.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <!-- viewport-fit=cover: the app draws under the notch and the home indicator and pads itself (SafeArea).
       The engine replaces this tag at start, keeping viewport-fit. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ong Music</title>
  <meta name="description" content="Jonathan Ong's highlights and the Ong Log: every song he played on stream, searchable.">
  <meta name="color-scheme" content="light dark">
  <!-- browser bars; the app updates them when the theme is changed in its settings -->
  <meta name="theme-color" content="#fff8f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15110e" media="(prefers-color-scheme: dark)">

  <!-- installed web app (iOS: Share → Add to Home Screen) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ong Music">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <style>
    /* --spin: the primary colour of the app theme, that of its own progress indicator */
    :root { --bg: #fff8f4; --fg: #54443a; --brand: #f4721f; --spin: #9a4600; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #15110e; --fg: #cbb9ac; --brand: #ff7a1a; --spin: #ffb37a; }
    }
    /* the theme chosen in the app's settings wins over the system one (set by the script below) */
    :root[data-theme="light"] { --bg: #fff8f4; --fg: #54443a; --brand: #f4721f; --spin: #9a4600; }
    :root[data-theme="dark"] { --bg: #15110e; --fg: #cbb9ac; --brand: #ff7a1a; --spin: #ffb37a; }
    html, body { margin: 0; height: 100%; background: var(--bg); }
    body {
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-text-size-adjust: 100%;
    }
    /*
      The spinner is where the app draws its own on the first frame while it downloads the catalogue, at the
      same size and in the same colour: the hand-over does not move it. The app centres its spinner (36 px), a
      20 px gap and a 20 px line of text in the space above its 68 px navigation bar and below the notch.
    */
    #loading {
      position: fixed; inset: 0; z-index: 10; box-sizing: border-box;
      padding: env(safe-area-inset-top) 0 calc(68px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
      background: var(--bg); color: var(--fg);
      font: 500 20px/20px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity 0.2s;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading .spinner {
      box-sizing: border-box; width: 36px; height: 36px; border-radius: 50%;
      border: 4px solid transparent; border-top-color: var(--spin);
      animation: spin 0.9s linear infinite;
    }
    #loading .message { display: none; max-width: 280px; text-align: center; font-size: 14px; font-weight: 400; }
    #loading.slow .message { display: block; }
    #loading .failed-text, #loading.failed .slow-text { display: none; }
    #loading.failed .failed-text { display: inline; }
    #loading.failed .spinner { visibility: hidden; }
    #loading button {
      margin-top: 12px; padding: 8px 20px; border: 0; border-radius: 20px;
      background: var(--brand); color: #2b1200; font: inherit; font-weight: 500;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #loading .spinner { animation-duration: 3s; } }
  </style>
</head>
<body>
  <div id="loading" role="status">
    <div class="spinner" aria-hidden="true"></div>
    <div>Ong Music</div>
    <div class="message"><span class="slow-text">Still loading…</span><span class="failed-text">Couldn’t load the app.</span> Check your connection.<br><button type="button" onclick="location.reload()">Reload</button></div>
  </div>
  <script>
    (function () {
      // Same colours as the app on the first paint: the theme setting is in shared_preferences (localStorage).
      try {
        var theme = JSON.parse(localStorage.getItem('flutter.themeMode') || 'null');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme;
          // iOS colours the status bar of the installed app from theme-color when it starts
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < metas.length; i++) {
            metas[i].removeAttribute('media');
            metas[i].setAttribute('content', theme === 'dark' ? '#15110e' : '#fff8f4');
          }
        }
      } catch (e) {}

      var loading = document.getElementById('loading');
      var slow = setTimeout(function () { loading.classList.add('slow'); }, 20000);
      // A file of the app that does not load (offline, a deployment in progress) stops the start for good: say so
      // at once rather than after the delay above. Called by flutter_bootstrap.js too, when the engine fails.
      function failed() {
        clearTimeout(slow);
        if (!loading.classList.contains('done')) loading.classList.add('slow', 'failed');
      }
      window.ongMusicLoadFailed = failed;
      // error events of <script> elements do not bubble: listen in the capture phase
      function scriptFailed(e) {
        if (e.target && e.target.tagName === 'SCRIPT') failed();
      }
      window.addEventListener('error', scriptFailed, true);
      // the loader fetches CanvasKit ahead and leaves a failure of it unhandled, and the engine then waits for ever
      window.addEventListener('unhandledrejection', failed);
      window.addEventListener('flutter-first-frame', function () {
        clearTimeout(slow);
        window.removeEventListener('error', scriptFailed, true);
        window.removeEventListener('unhandledrejection', failed);
        loading.classList.add('done');
        setTimeout(function () { loading.remove(); }, 300);
      });

      // flutter_bootstrap.js names the content-hashed main.dart.<hash>.js and assets of its build. GitHub Pages
      // lets browsers reuse any file for 10 minutes without asking, so a cached bootstrap could point to the
      // files of a previous deployment. Revalidating it (cheap: 304 when unchanged) keeps the whole app from
      // the current deployment. Offline or on error: the plain script tag (browser cache).
      var bootstrapText = null;
      function run(code) {
        var s = document.createElement('script');
        if (code != null) {
          s.text = code;
        } else {
          s.src = 'flutter_bootstrap.js';
          s.onerror = failed;
        }
        document.body.appendChild(s);
      }
      function fetchBootstrap() {
        return fetch('flutter_bootstrap.js', { cache: 'no-cache' }).then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.text();
        });
      }
      fetchBootstrap().then(function (code) { bootstrapText = code; run(code); }, function () { run(null); });

      // An installed app can stay in memory for days. When it comes back after an hour or more and a new
      // version has been deployed meanwhile, reload it (state is lost, but the user was away for an hour).
      var hiddenAt = 0;
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden') {
          hiddenAt = Date.now();
        } else if (hiddenAt && Date.now() - hiddenAt >= 3600000 && bootstrapText != null) {
          fetchBootstrap().then(function (code) {
            if (code !== bootstrapText) location.reload();
          }, function () {});
        }
      });
    })();
  </script>
</body>
</html>
